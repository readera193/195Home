name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [app-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          # app-service 的 Dockerfile 以 repo 根目錄為 context，以便一併建置 frontend/ 靜態檔案
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/195home-${{ matrix.service }}:latest

  # 注意：實際設定 Northflank 專案時，請對照 Northflank API 文件確認觸發重新部署的
  # 端點路徑與所需 secrets（NORTHFLANK_API_TOKEN、NORTHFLANK_PROJECT_ID、
  # NORTHFLANK_APP_SERVICE_ID、NORTHFLANK_NOTIFICATION_SERVICE_ID）是否與下方一致，
  # 必要時改用 Northflank 官方 CLI（northflank）取代直接呼叫 REST API。
  deploy-to-northflank:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Northflank redeploy - app-service
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            "https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/services/${{ secrets.NORTHFLANK_APP_SERVICE_ID }}/redeploy"
      - name: Trigger Northflank redeploy - notification-service
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            "https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/services/${{ secrets.NORTHFLANK_NOTIFICATION_SERVICE_ID }}/redeploy"
