name: CD

# 僅在 master 分支的 CI 成功後才發布；CI 失敗不會部署
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # app-service 的 Dockerfile 以 repo 根目錄為 context，以便一併建置 frontend/ 靜態檔案；
          # notification-service 的 Dockerfile 以自身目錄為 context（與 docker-compose.yml 一致）
          - service: app-service
            context: .
          - service: notification-service
            context: ./notification-service
    steps:
      - uses: actions/checkout@v4
        with:
          # 部署通過 CI 的那個 commit，而非 workflow 觸發當下 master 的最新狀態
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/195home-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,value=${{ github.event.workflow_run.head_sha }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_LINE_CHANNEL_ID=${{ vars.LINE_LOGIN_CHANNEL_ID }}
  # 以 Northflank API 重啟服務（POST .../services/{id}/restart），所需 secrets：NORTHFLANK_API_TOKEN、
  # NORTHFLANK_PROJECT_ID、NORTHFLANK_APP_SERVICE_ID、NORTHFLANK_NOTIFICATION_SERVICE_ID。
  # 注意：重啟是否會重新拉取 latest 這個 tag 的新 image 取決於服務的 image 拉取設定，
  # 若新版沒有生效，請改用 redeploy 或調整拉取策略。
  deploy-to-northflank:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # --fail-with-body：端點回 4xx/5xx 時讓 step 失敗並印出回應內容，避免部署失敗卻顯示綠燈
      - name: Trigger Northflank restart - app-service
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            "https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/services/${{ secrets.NORTHFLANK_APP_SERVICE_ID }}/restart"
      - name: Trigger Northflank restart - notification-service
        run: |
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_API_TOKEN }}" \
            "https://api.northflank.com/v1/projects/${{ secrets.NORTHFLANK_PROJECT_ID }}/services/${{ secrets.NORTHFLANK_NOTIFICATION_SERVICE_ID }}/restart"
