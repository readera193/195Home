name: CD

# 僅在 main 分支的 CI 成功後才發布；CI 失敗不會部署
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # app-service 的 Dockerfile 以 repo 根目錄為 context，以便一併建置 frontend/ 靜態檔案；
          # notification-service 的 Dockerfile 以自身目錄為 context（與 docker-compose.yml 一致）
          - service: app-service
            context: .
          - service: notification-service
            context: ./notification-service
    steps:
      - uses: actions/checkout@v7
        with:
          # 部署通過 CI 的那個 commit，而非 workflow 觸發當下 main 的最新狀態
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short sha
        id: vars
        run: echo "short_sha=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/195home-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_LINE_CHANNEL_ID=${{ vars.LINE_LOGIN_CHANNEL_ID }}

  # 以不可變的 sha tag 指定 Northflank 部署的 image，部署結果可追溯、也方便回滾。
  # 所需 secrets：NORTHFLANK_API_TOKEN、NORTHFLANK_PROJECT_ID、NORTHFLANK_APP_SERVICE_ID、NORTHFLANK_NOTIFICATION_SERVICE_ID；
  # 所需 variables：NORTHFLANK_CREDENTIALS_ID（Northflank 內可拉取 GHCR image 的 registry credentials）。
  deploy-to-northflank:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: app-service
            service-id-secret: NORTHFLANK_APP_SERVICE_ID
          - service: notification-service
            service-id-secret: NORTHFLANK_NOTIFICATION_SERVICE_ID
    steps:
      - name: Set deployment image
        run: |
          echo "DEPLOY_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/195home-${{ matrix.service }}:sha-${HEAD_SHA::7}" >> "$GITHUB_ENV"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy ${{ matrix.service }} to Northflank
        uses: northflank/deploy-to-northflank@v1
        with:
          northflank-api-key: ${{ secrets.NORTHFLANK_API_TOKEN }}
          project-id: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          service-id: ${{ secrets[matrix.service-id-secret] }}
          image-path: ${{ env.DEPLOY_IMAGE }}
          credentials-id: ${{ vars.NORTHFLANK_CREDENTIALS_ID }}
