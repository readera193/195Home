# 本機 Docker 環境。所有密碼與密鑰都可在 .env 覆寫（範本 .env.example），未設定時使用僅限本機的開發預設值。
# LINE 為選用：在 .env（範本 .env.example）填入 LINE 憑證後，
# 登入頁會同時出現「使用 LINE 登入」與「Demo 體驗」；未填則只有 Demo 體驗。
# 修改 .env 後須重新建置前端才會生效：docker compose up -d --build
#
# 實測 LINE 登入：LINE Developers Console 的 Callback URL 須登錄為 LINE_LOGIN_REDIRECT_URI
# （預設 http://localhost:8080/login/callback），請以 http://localhost:8080 開啟網站（不可用 127.0.0.1）。
# 實測 LINE Webhook：需公網 HTTPS，先啟動 ngrok（ngrok http --url=<固定網域> 8081），
# 再把 https://<固定網域>/api/line/webhook 填到 LINE Developers Console 的 Webhook URL。
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:-app}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-notificationdb.sh:/docker-entrypoint-initdb.d/10-notificationdb.sh:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app-service:
    build:
      context: .
      dockerfile: app-service/Dockerfile
      args:
        # LINE Login channel ID 為公開資訊，建置時內嵌到前端；為空則不顯示 LINE 登入按鈕
        VITE_LINE_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: "3306"
      APPDB_NAME: appdb
      DB_USERNAME: app
      DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-please-32bytes+}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-only-internal-token-change-me}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_REDIRECT_URI: ${LINE_LOGIN_REDIRECT_URI:-http://localhost:8080/login/callback}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      app-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: "3306"
      NOTIFICATIONDB_NAME: notificationdb
      DB_USERNAME: notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
      APP_SERVICE_BASE_URL: http://app-service:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-only-internal-token-change-me}
      LINE_CHANNEL_TOKEN: ${LINE_CHANNEL_TOKEN:-dev-placeholder-token}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-dev-placeholder-secret}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
