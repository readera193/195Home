# 本機開發用：預設值僅供開發，MUST NOT 用於正式環境
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${NOTIFICATIONDB_NAME:notificationdb}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME:notification}
    password: ${DB_PASSWORD:notification}

app:
  app-service:
    base-url: ${APP_SERVICE_BASE_URL:http://localhost:8080}
  internal:
    token: ${INTERNAL_TOKEN:dev-only-internal-token-change-me}

logging:
  level:
    com.family195home: DEBUG
