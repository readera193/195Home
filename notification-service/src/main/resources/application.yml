server:
  port: 8081

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${NOTIFICATIONDB_NAME:notificationdb}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC
    username: ${DB_USERNAME:notification}
    password: ${DB_PASSWORD:notification}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  app-service:
    base-url: ${APP_SERVICE_BASE_URL:http://app-service:8080}
  internal:
    token: ${INTERNAL_TOKEN:dev-only-internal-token-change-me}
  line:
    channel-token: ${LINE_CHANNEL_TOKEN:}
    channel-secret: ${LINE_CHANNEL_SECRET:}
  notification:
    max-retries: 3

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.family195home: DEBUG
