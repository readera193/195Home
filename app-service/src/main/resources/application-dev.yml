# 本機開發用：預設值僅供開發，MUST NOT 用於正式環境
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${APPDB_NAME:appdb}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes+}
  internal:
    token: ${INTERNAL_TOKEN:dev-only-internal-token-change-me}

logging:
  level:
    com.family195home: DEBUG
