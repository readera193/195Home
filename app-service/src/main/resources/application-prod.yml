# 正式環境：機密（DB_HOST / DB_USERNAME / DB_PASSWORD / JWT_SECRET / INTERNAL_TOKEN）
# 皆無預設值，由 Northflank 環境變數 / Secret Group 提供，缺少任一項時應用程式啟動失敗（fail-fast）。
logging:
  level:
    root: INFO
    com.family195home: INFO

management:
  endpoint:
    health:
      show-details: never

# LINE Login channel（須與 notification-service 的 Messaging API channel 屬同一個 Provider）；
# redirect-uri 須與前端回呼網址（<網站網址>/login/callback）及 LINE Developers Console 設定完全一致
app:
  line:
    login:
      channel-id: ${LINE_LOGIN_CHANNEL_ID}
      channel-secret: ${LINE_LOGIN_CHANNEL_SECRET}
      redirect-uri: ${LINE_LOGIN_REDIRECT_URI}
